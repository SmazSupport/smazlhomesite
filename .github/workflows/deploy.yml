name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=github-actions --accept-routes

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.111.162.0
          username: cascade
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/docker/web/smazlsite
            git pull
            docker compose up -d --build
